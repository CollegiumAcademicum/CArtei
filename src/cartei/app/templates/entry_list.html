{% extends 'base.html' %}

{% block content %}
<h1>Entries List</h1>
<form method="get" class="mb-3">
    <input type="text" name="search" class="form-control" placeholder="Search">
    <button type="submit" class="btn btn-primary mt-2">Search</button>
</form>
<a href="{% url 'entry_create' %}" class="btn btn-success">Add New Entry</a>
<a href="{% url 'populate_from_csv' %}" class="btn btn-secondary">Populate from CSV</a>
<table class="table">

    {% for entry in entries %}
    <tr>

        <td>{{ entry.name }}</td>
        <td>{{ entry.email }}</td>
        <td>
            {% if entry.enrollment_certificate %}
            &#x2714;
            {% else %}
            &#x274C;
            {% endif %}
        </td>

        <td>
            <a href="{% url 'entry_update' entry.pk %}" class="btn btn-sm btn-warning">Edit</a>
            <a href="{% url 'entry_delete' entry.pk %}" class="btn btn-sm btn-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
    </table>
{% endblock %}
