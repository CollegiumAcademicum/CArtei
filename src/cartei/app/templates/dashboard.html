{% extends 'base.html' %}

{% block content %}
  <h2>Dein Dashboard</h2>
  
  <!-- Suchleiste mit Suchvorschlägen -->
  <div class="position-relative mb-3">
    <input type="text" id="search-input" placeholder="Suche nach Kacheln" class="form-control" autocomplete="off">
    <div id="suggestions-list" class="list-group position-absolute w-100" style="display: none; z-index: 1000;"></div>
  </div>

  <!-- Kachel-Anzeige -->
  <div id="tiles" class="row">
    {% if user_tiles %}
      {% for user_tile in user_tiles %}
        <div class="col-6 col-sm-4 col-md-3 mb-3">
          <div class="tile card" data-id="{{ user_tile.tile.id }}">
            <div class="card-body text-center">
              <a href="{{ user_tile.tile.link }}" class="card-link">{{ user_tile.tile.title }}</a>
            </div>
          </div>
        </div>
      {% endfor %}
    {% else %}
      <p>Keine Kacheln gefunden.</p>
    {% endif %}
  </div>

  <button id="save-order-btn" class="btn btn-primary mt-3">Reihenfolge speichern</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
  <script>
    // Initialisiere Sortable.js für die Kachel-Container
    const sortable = new Sortable(document.getElementById('tiles'), {
      animation: 150,
    });

    document.getElementById('save-order-btn').addEventListener('click', () => {
      const order = [];
      document.querySelectorAll('.tile').forEach(tile => {
        order.push(tile.getAttribute('data-id'));
      });

      // Verwende `URLSearchParams` korrekt, um jedes Listenelement einzeln hinzuzufügen
      const formData = new URLSearchParams();
      order.forEach(id => formData.append('order[]', id));

      // AJAX-Request zum Speichern der Reihenfolge
      fetch("{% url 'save_tile_order' %}", {
        method: 'POST',
        headers: {
          'X-CSRFToken': '{{ csrf_token }}',
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          alert('Reihenfolge erfolgreich gespeichert!');
        } else {
          alert('Speichern der Reihenfolge fehlgeschlagen!');
        }
      })
      .catch(error => {
        console.error('Fehler beim Speichern:', error);
        alert('Speichern der Reihenfolge fehlgeschlagen!');
      });
    });

    // Live-Suchvorschläge für die Kacheln
    const searchInput = document.getElementById('search-input');
    const suggestionsList = document.getElementById('suggestions-list');

    searchInput.addEventListener('keyup', () => {
      const query = searchInput.value.trim();
      if (query.length > 0) {
        fetch(`/search_suggestions/?q=${query}`, {
          headers: {
            'X-CSRFToken': '{{ csrf_token }}',
          },
        })
        .then(response => response.json())
        .then(data => {
          suggestionsList.innerHTML = '';  // Lösche vorhandene Vorschläge
          if (data.suggestions.length > 0) {
            suggestionsList.style.display = 'block';
            data.suggestions.forEach(suggestion => {
              const suggestionItem = document.createElement('a');
              suggestionItem.className = 'list-group-item list-group-item-action';
              suggestionItem.textContent = suggestion.title;
              suggestionItem.href = `?search=${encodeURIComponent(suggestion.title)}`;
              suggestionsList.appendChild(suggestionItem);
            });
          } else {
            suggestionsList.style.display = 'none';
          }
        });
      } else {
        suggestionsList.style.display = 'none';
      }
    });

    // Schließen der Vorschläge, wenn außerhalb geklickt wird
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#search-input') && !e.target.closest('#suggestions-list')) {
        suggestionsList.style.display = 'none';
      }
    });
  </script>
{% endblock %}
