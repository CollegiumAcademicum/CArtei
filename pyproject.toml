[project]
name = "cartei"
version = "0.1.0"
description = "CArtei tenant management system"
requires-python = ">=3.14"
dependencies = [
    "django>=5.0",
    "django-auth-ldap>=4.8",
    "psycopg[binary]>=3.0",
    "gunicorn>=22.0",
    "python-dotenv>=1.0",
    "whitenoise>=6.0",
    "weasyprint>=69.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pylatex>=1.4",
    "python-freeipa>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "cartei.settings_test"
