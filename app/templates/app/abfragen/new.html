{% extends "app/base.html" %}
{% block title %}Neue Abfrage — CArtei{% endblock %}
{% block content %}
<div class="ca-card" style="max-width:560px;">
  <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:1.5rem;">Neue Abfrage erstellen</h1>
  <form method="post">
    {% csrf_token %}
    <div class="ca-field">
      <label class="ca-label" for="id_date">Datum</label>
      <input class="ca-input" type="date" name="date" id="id_date" required>
    </div>
    <div class="ca-field">
      <label class="ca-label" for="id_label">Bezeichnung (optional)</label>
      <input class="ca-input" type="text" name="label" id="id_label">
    </div>
    <div class="ca-field">
      <label class="ca-label" for="id_ends_at">Offizielle Deadline</label>
      <input class="ca-input" type="date" name="ends_at" id="id_ends_at" required>
    </div>
    <div class="ca-field">
      <label class="ca-label" for="id_grace_ends_at">Nachfrist bis</label>
      <input class="ca-input" type="date" name="grace_ends_at" id="id_grace_ends_at" required>
    </div>
    <div style="display:flex;gap:0.75rem;align-items:center;margin-top:1.5rem;">
      <button type="submit" class="ca-button">Erstellen</button>
      <a href="{% url 'abfragen_list' %}" class="ca-button-outline" style="text-decoration:none;">Abbrechen</a>
    </div>
  </form>
</div>
<script nonce="{{ csp_nonce }}">
  function isoDate(d) { return d.toISOString().slice(0, 10); }
  var today = new Date();
  var ends = new Date(today); ends.setDate(ends.getDate() + 14);
  var grace = new Date(ends); grace.setDate(grace.getDate() + 5);
  document.getElementById('id_date').value = isoDate(today);
  document.getElementById('id_ends_at').value = isoDate(ends);
  document.getElementById('id_grace_ends_at').value = isoDate(grace);
</script>
{% endblock %}
