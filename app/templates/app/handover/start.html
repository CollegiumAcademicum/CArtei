{# CArtei/app/templates/app/handover/start.html #}
{% extends "app/base.html" %}
{% block content %}
<div class="ca-card" style="max-width:560px;margin:1rem auto;">
  <h2 style="margin:.2rem 0 1rem;">Übergabe starten</h2>
  {% if room %}
    <p style="color:#555;margin:-.4rem 0 1rem;">{{ room.wg.name }} {{ room.name }}</p>
    <form method="post" action="{% url 'uebergabe_start' %}?room={{ room.id }}" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="ca-button">Weiter</button>
    </form>
  {% else %}
    <p style="color:#555;margin:-.4rem 0 1rem;">Zimmer wählen:</p>
    <form method="get" action="{% url 'uebergabe_start' %}">
      <select name="room" required>
        <option value="">– Zimmer –</option>
        {% for r in rooms %}<option value="{{ r.id }}">{{ r.wg.name }} {{ r.name }}</option>{% endfor %}
      </select>
      <button type="submit" class="ca-button">Weiter</button>
    </form>
  {% endif %}
</div>
{% endblock %}
