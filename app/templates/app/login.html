{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden — CArtei</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'app/ca.css' %}">
  <link rel="icon" href="https://collegiumacademicum.de/img/logo-small.png">
</head>
<body>

<nav class="ca-navbar">
  <a class="ca-navbar-logo" href="https://collegiumacademicum.de">
    <img src="https://collegiumacademicum.de/img/logo-small.png" alt="Collegium Academicum">
  </a>
</nav>

<div class="ca-main ca-login-wrap">
  <div class="ca-login-logo">
    <img src="https://collegiumacademicum.de/img/logo.png" alt="Collegium Academicum">
  </div>

  <div class="ca-login-card">
    <div class="ca-login-title">CArtei</div>

    {% if form.errors %}
      <div class="ca-message error">Benutzername oder Passwort ungültig.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="ca-field">
        <label class="ca-label" for="id_username">Intranet-Benutzername</label>
        <input class="ca-input" type="text" name="username" id="id_username" autofocus required>
      </div>
      <div class="ca-field">
        <label class="ca-label" for="id_password">Intranet-Passwort</label>
        <div style="position:relative;">
          <input class="ca-input" type="password" name="password" id="id_password" required style="padding-right:2.5rem;">
          <button type="button" onclick="(function(){var i=document.getElementById('id_password');i.type=i.type==='password'?'text':'password';})()" style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:#7a7a7a;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="ca-button">Anmelden</button>
    </form>
  </div>
</div>

<footer class="ca-footer">
  <div class="ca-footer-logo">
    <img src="https://collegiumacademicum.de/img/logo-small.png" alt="Collegium Academicum">
  </div>
  <span class="ca-footer-email">kontakt@collegiumacademicum.de</span>
  <div class="ca-footer-links">
    <a href="https://collegiumacademicum.de/impressum" target="_blank">Impressum</a>
    <a href="https://collegiumacademicum.de/datenschutz" target="_blank">Datenschutz</a>
    <a href="https://collegiumacademicum.de/kontakt" target="_blank">Kontakt</a>
  </div>
</footer>

</body>
</html>
